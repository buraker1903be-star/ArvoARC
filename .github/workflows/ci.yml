name: Kontrol

# Her pushta ve PR'da tip, lint ve birim testleri çalışır.
# Derleme (next build) Vercel'de yapılıyor; burada Supabase anahtarı gerekmez.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipler
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testler
        run: npm test
      # Yeni migration adı ve sürüm sırası (scripts/check-migrations.mjs).
      # ArvoOS ve ARC aynı veritabanına yazıyor; migration'lar SQL Editor'den
      # elle uygulanıyor, sıralama hatası ancak burada yakalanır.
      - name: Migration denetimi
        run: npm run check:migrations
      # UTC'ye göre alınan gün gece 00:00–03:00 arasında DÜN demek
      # (scripts/check-saat-dilimi.mjs; 16.10.2026 sipariş numarası).
      - name: Saat dilimi denetimi
        run: npm run check:saat-dilimi
      - name: Veritabanı testleri
        run: npm run test:db
      # Koddaki tablo/sütun/fonksiyon adları canlı şemada var mı
      # (supabase/schema/katalog.json). Supabase istemcisi tipsiz; yanlış
      # sütun adı derlemede görünmez, üretimde sessizce boş veri döndürür.
      - name: Şema sözleşmesi
        run: npm run check:schema
      # RLS açık ama politikası olmayan bir tabloyu çağıranın yetkisiyle
      # okumak sessizce BOŞ sonuç verir: 17.10.2026'da manuel sipariş,
      # stok hareketi ve iade stoğu bu yüzden canlıda ölüydü.
      - name: RLS politikaları
        run: npm run check:rls
      # Vitrin fonksiyonlarının iki ailesi (çok kiracılı
      # arc_storefront_* ve ArvoCulture'a özel get_arvoculture_*)
      # gövdece aynı olmak zorunda. 17.10.2026'da ayrışmış
      # bulundular: arama dizini ve sitemap ikizleri düzeltilirken
      # dışarıda kalmış, varyant sınırı ikizde 200 olurken burada
      # 60'ta kalmıştı. İkinci kiracı açılırken yaşanacaktı.
      - name: Kiracı ikizleri
        run: npm run check:ikizler
